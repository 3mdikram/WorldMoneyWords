[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldmoneywords"
version = "2.5.1"
description = "Python amount-to-words library with multilingual currency wording and 200-country ISO support"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  {name = "Md Ikram"}
]
keywords = ["amount-to-words", "amount-to-text", "money-to-words", "money-to-text", "number-to-words", "currency-to-words", "currency-converter", "multilingual", "english", "hindi", "arabic", "invoice", "cheque", "iso-3166", "iso-4217"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://github.com/3mdikram/WorldMoneyWords"
Repository = "https://github.com/3mdikram/WorldMoneyWords"
Issues = "https://github.com/3mdikram/WorldMoneyWords/issues"

[tool.setuptools.packages.find]
where = ["src"]
